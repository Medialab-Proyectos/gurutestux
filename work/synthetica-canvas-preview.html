  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

            &lt;/div&gt;

      const connectorHtml = (stage, next) =&gt; {
        const stateClass = stage.state === &#x27;completed&#x27; ? &#x27;completed&#x27; : &#x27;&#x27;;

      const renderWorld = () =&gt; {

      const renderNavigation = () =&gt; {
        root.querySelector(&#x27;#ac-stage-jumps&#x27;).innerHTML = stages.map(stage =&gt; `&lt;button class=&quot;ac-jump cursor-interaction&quot; type=&quot;button&quot; data-jump=&quot;${stage.id}&quot; aria-pressed=&quot;${stage.id === selected}&quot;&gt;${stage.id} · ${stage.short}&lt;/button&gt;`).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-jump]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; jumpTo(Number(button.dataset.jump))));

      const applyTransform = () =&gt; {
        world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;

      };

      const jumpTo = id =&gt; {
        selected = id;

        const center = stageLeft(id) + 280;
        x = viewport.clientWidth / 2 - center * scale;
        y = 16;
        applyTransform();
        renderNavigation();
        persist();
      };

      const setScale = nextScale =&gt; {
        const old = scale;
        scale = Math.max(0.18, Math.min(1.3, nextScale));
        const cx = viewport.clientWidth / 2;
        const cy = viewport.clientHeight / 2;
        x = cx - ((cx - x) / old) * scale;
        y = cy - ((cy - y) / old) * scale;
        applyTransform();
        persist();
      };

      const fitAll = () =&gt; {
        const usableWidth = Math.max(300, viewport.clientWidth - 36);
        scale = Math.max(0.15, Math.min(0.78, usableWidth / 6900));

        y = Math.max(18, (viewport.clientHeight - 650 * scale) / 2);
        applyTransform();
        persist();

      const openDrawer = id =&gt; {

        root.querySelector(&#x27;#ac-detail-principles&#x27;).innerHTML = stage.principles.map(item =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#ac-detail-output&#x27;).innerHTML = stage.outputs.map(item =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#ac-detail-evaluation&#x27;).innerHTML = stage.evaluation.map(item =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&#x27;&#x27;);

      const showHome = () =&gt; {
        home.classList.remove(&#x27;ac-is-hidden&#x27;);

        syntheticIndex.classList.add(&#x27;ac-is-hidden&#x27;);

        root.querySelector(&#x27;#ac-current-project&#x27;).textContent = &#x27;Sin proyecto abierto&#x27;;

      const showWorkspace = projectName =&gt; {
        home.classList.add(&#x27;ac-is-hidden&#x27;);

        root.querySelector(&#x27;.ac-run-status&#x27;).classList.remove(&#x27;ac-is-hidden&#x27;);

      const renderLightAgents = count =&gt; {
        const agents = [

          [&#x27;S-02 · Mateo&#x27;, &#x27;Usuario frecuente · escritorio · orientado a eficiencia&#x27;],
          [&#x27;S-03 · Sara&#x27;, &#x27;Uso asistido · móvil · necesita lenguaje directo&#x27;],
          [&#x27;S-04 · David&#x27;, &#x27;Experiencia media · escritorio · trabaja con prisa&#x27;],
          [&#x27;S-05 · Nora&#x27;, &#x27;Primera vez · tableta · compara antes de decidir&#x27;]

        root.querySelector(&#x27;#ac-light-agent-list&#x27;).innerHTML = agents.slice(0, count).map(agent =&gt; `&lt;div class=&quot;ac-light-agent&quot;&gt;&lt;strong&gt;${agent[0]}&lt;/strong&gt;&lt;span&gt;${agent[1]}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#ac-index-agent-count&#x27;).textContent = `${count} agentes ligeros`;
        const coincidences = root.querySelectorAll(&#x27;.ac-severity-table tbody tr td:last-child&#x27;);
        const shared = Math.max(2, count - 1);

      const showSyntheticIndex = (projectName = &#x27;Checkout comercio digital&#x27;, number = syntheticExecution) =&gt; {

      const openProjectSetup = kind =&gt; {

        root.querySelector(&#x27;#ac-project-type&#x27;).textContent = synthetic ? &#x27;Estudio puntual · URL + población + 3–5 agentes ligeros&#x27; : &#x27;Proyecto completo · recorrido por las nueve cajas&#x27;;
        root.querySelector(&#x27;#ac-project-name&#x27;).value = synthetic ? &#x27;Nuevo estudio sintético&#x27; : &#x27;Nuevo producto digital&#x27;;
        root.querySelector(&#x27;#ac-project-name-label&#x27;).textContent = synthetic ? &#x27;Nombre del estudio&#x27; : &#x27;Nombre del proyecto&#x27;;
        root.querySelector(&#x27;#ac-modal-synthetica-brand&#x27;).classList.toggle(&#x27;is-visible&#x27;, synthetic);

        root.querySelector(&#x27;#ac-source-note&#x27;).innerHTML = synthetic ? &#x27;&lt;strong&gt;Modo ligero Synthetica:&lt;/strong&gt; reutiliza la tecnología de población sintética, conserva GOMS como estructura de metas y métodos, pero no ejecuta KLM ni graba video. La vista final muestra quiénes evaluaron y la tabla de severidad. No se modifica ningún proyecto existente de Agentes Sintéticos.&#x27; : &#x27;&lt;strong&gt;Lectura inicial:&lt;/strong&gt; documentos, PDF, hojas de cálculo, imágenes, transcripciones, HTML y notas de investigación. La plataforma crea el contexto del problema; la ejecución automática se inicia desde la consola.&#x27;;
        root.querySelector(&#x27;#ac-config-status&#x27;).classList.remove(&#x27;is-visible&#x27;);

      const updateSyntheticPaths = () =&gt; {

        root.querySelector(&#x27;#ac-flows-config&#x27;).value = `${rootPath}\\proyectos\\${id}\\recorridos.json`;

        root.querySelector(&#x27;#ac-last-study-file&#x27;).value = `${rootPath}\\ULTIMO_ESTUDIO.txt`;

      const openLivePreview = id =&gt; {

        root.querySelector(&#x27;#ac-live-view-title&#x27;).textContent = &#x27;Vista inicial&#x27;;
        root.querySelector(&#x27;#ac-live-view-copy&#x27;).textContent = `Prototipo navegable generado por la caja ${stage.id}.`;
        root.querySelectorAll(&#x27;[data-live-view]&#x27;).forEach((button, index) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, index === 0 ? &#x27;true&#x27; : &#x27;false&#x27;));
        root.querySelector(&#x27;#ac-live-layer&#x27;).classList.add(&#x27;is-open&#x27;);
      };

      viewport.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
        if (event.target.closest(&#x27;button&#x27;)) return;
        dragging = true;
        pointerStart = { clientX: event.clientX, clientY: event.clientY, x, y };
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add(&#x27;is-dragging&#x27;);
      });
      viewport.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        if (!dragging || !pointerStart) return;
        x = pointerStart.x + event.clientX - pointerStart.clientX;
        y = pointerStart.y + event.clientY - pointerStart.clientY;
        applyTransform();
      });
      const endDrag = event =&gt; {
        if (!dragging) return;
        dragging = false;
        pointerStart = null;
        viewport.classList.remove(&#x27;is-dragging&#x27;);
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        persist();
      };
      viewport.addEventListener(&#x27;pointerup&#x27;, endDrag);
      viewport.addEventListener(&#x27;pointercancel&#x27;, endDrag);
      viewport.addEventListener(&#x27;wheel&#x27;, event =&gt; {
        event.preventDefault();
        if (event.ctrlKey) setScale(scale * (event.deltaY &gt; 0 ? 0.9 : 1.1));
        else { x -= event.deltaX || event.deltaY; applyTransform(); persist(); }
      }, { passive: false });

      root.querySelector(&#x27;#ac-zoom-in&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setScale(scale + 0.1));
      root.querySelector(&#x27;#ac-zoom-out&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setScale(scale - 0.1));
      root.querySelector(&#x27;#ac-fit&#x27;).addEventListener(&#x27;click&#x27;, fitAll);
      root.querySelector(&#x27;#ac-drawer-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; drawer.classList.remove(&#x27;is-open&#x27;));

      root.querySelector(&#x27;#ac-go-projects&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        showHome();

      });
      root.querySelector(&#x27;#ac-new-project&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        showHome();
        root.querySelector(&#x27;#ac-create-heading&#x27;).scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;center&#x27; });
      });
      root.querySelectorAll(&#x27;[data-create-kind]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; openProjectSetup(button.dataset.createKind)));
      root.querySelectorAll(&#x27;[data-open-project]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; button.dataset.projectKind === &#x27;synthetic&#x27; ? showSyntheticIndex(button.dataset.openProject) : showWorkspace(button.dataset.openProject)));
      root.querySelector(&#x27;#ac-back-projects&#x27;).addEventListener(&#x27;click&#x27;, showHome);
      root.querySelectorAll(&#x27;[data-close-modal]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; closeModal(button.dataset.closeModal)));
      root.querySelectorAll(&#x27;[data-pick-folder]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const field = button.previousElementSibling;
        if (!field.value) field.value = button.dataset.pickFolder === &#x27;prototipo&#x27; ? &#x27;C:\\Synthetica\\Proyecto\\prototipo.html&#x27; : `C:\\Synthetica\\Proyecto\\${button.dataset.pickFolder}`;
        button.textContent = &#x27;Seleccionada&#x27;;
      }));
      root.querySelector(&#x27;#ac-project-id&#x27;).addEventListener(&#x27;input&#x27;, updateSyntheticPaths);
      root.querySelector(&#x27;#ac-engine-root&#x27;).addEventListener(&#x27;input&#x27;, updateSyntheticPaths);
      root.querySelector(&#x27;#ac-save-project&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const status = root.querySelector(&#x27;#ac-config-status&#x27;);
        if (setupKind === &#x27;synthetic&#x27;) {
          syntheticExecution += 1;
          const number = String(syntheticExecution).padStart(3, &#x27;0&#x27;);
          status.textContent = `Estudio #${number} registrado con ${root.querySelector(&#x27;#ac-agent-count&#x27;).value} agentes ligeros.`;
          root.querySelector(&#x27;#ac-synthetic-project-meta&#x27;).textContent = `Estudio sintético · Estudio #${number} · Configurado · pendiente de ejecución`;
          root.querySelector(&#x27;#ac-synthetic-project-name&#x27;).textContent = root.querySelector(&#x27;#ac-project-name&#x27;).value;
          root.querySelector(&#x27;#ac-open-synthetic-project&#x27;).dataset.openProject = root.querySelector(&#x27;#ac-project-name&#x27;).value;
          root.querySelector(&#x27;#ac-open-last-study&#x27;).textContent = `Abrir último estudio #${number}`;
          const afterSave = root.querySelector(&#x27;#ac-after-save&#x27;);
