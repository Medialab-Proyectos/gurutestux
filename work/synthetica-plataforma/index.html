<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetica · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --brand: #7156D9;
  --blue: light-dark(#5C43C5, #B8ACFF);
  --blue-2: light-dark(#7156D9, #A997FF);
  --green: light-dark(#247A61, #63D2AC);
  --red: light-dark(#C93F4F, #FF8993);
  --orange: light-dark(#B96A16, #FFB56D);
  --ink: light-dark(#242327, #F7F5FC);
  --muted: light-dark(#66616F, #B9B2C8);
  --bg: light-dark(#F4F2F8, #12101A);
  --board: light-dark(#FFFFFF, #1A1724);
  --panel: light-dark(#FAF9FC, #231F30);
  --line: light-dark(#DDD8E7, #443D56);
  --soft-blue: light-dark(#F0ECFF, #2B2446);
  --soft-green: light-dark(#EAF6F1, #21362F);
  --soft-orange: light-dark(#FFF3E7, #3C2B1D);
  --soft-red: light-dark(#FDEDEF, #3A1F25);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Manrope, "DM Sans", Arial, sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Estructura */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--board); border-right: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; padding: 2px 6px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 20px; letter-spacing: -.6px; }
.logo svg { width: 25px; height: 25px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--board); color: var(--blue); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--blue-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #5C43C5; }
.btn.good { color: var(--green); }
.btn.bad { color: var(--red); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 600; }
.nav a:hover { background: var(--panel); }
.nav a[aria-current="page"] { background: var(--soft-blue); color: var(--blue); }
.count { min-width: 22px; padding: 0 7px; border-radius: 11px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 800; text-align: center; line-height: 20px; }
.side-label { padding: 0 10px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.side-projects { display: grid; gap: 2px; }
.side-projects a { display: grid; gap: 4px; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.side-projects a:hover { background: var(--panel); }
.side-projects a[aria-current="page"] { background: var(--soft-blue); }
.side-projects strong { font-size: 13px; font-weight: 700; line-height: 1.3; }
.side-projects small { color: var(--muted); font-size: 11px; }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-foot label { display: grid; gap: 4px; }
.side-foot select { min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--board); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 5px 10px; border: 0; background: var(--board); color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--soft-blue); color: var(--blue); }
.seg button[disabled] { opacity: .4; cursor: not-allowed; }

.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 10px 28px; background: color-mix(in srgb, var(--board) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--blue); }
.crumbs strong { color: var(--ink); }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.menu-btn { display: none; }
.app.sin-sesion { grid-template-columns: 1fr; }
.app.sin-sesion .side, .app.sin-sesion .top { display: none; }
/* Barra lateral contraíble hacia la izquierda */
.app { transition: grid-template-columns .2s; }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.colapsar { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--board); color: var(--blue); cursor: pointer; flex: none; }
.colapsar svg { width: 16px; height: 16px; transition: transform .2s; }
.nav a .ico, .btn .ico { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
.nav a .ico svg, .btn .ico svg { width: 18px; height: 18px; }
.nav a > span:first-child { display: inline-flex; align-items: center; gap: 10px; }
.app.colapsada { grid-template-columns: 68px minmax(0, 1fr); }
.app.colapsada .side { padding: 18px 10px; align-items: stretch; }
.app.colapsada .side-top { flex-direction: column; gap: 12px; }
.app.colapsada .logo .txt, .app.colapsada .nav .txt, .app.colapsada .btn .txt,
.app.colapsada .side-label, .app.colapsada .side-projects, .app.colapsada .side-foot { display: none; }
.app.colapsada .logo { justify-content: center; padding: 2px 0; }
.app.colapsada .colapsar svg { transform: rotate(180deg); }
.app.colapsada .side > .btn.primary { padding: 7px 0; }
.app.colapsada .nav a { justify-content: center; position: relative; padding: 10px 0; }
.app.colapsada .nav .count { position: absolute; top: 2px; right: 2px; min-width: 18px; line-height: 16px; font-size: 10px; padding: 0 4px; }
@media (prefers-reduced-motion: reduce) { .app, .colapsar svg { transition: none; } }
.content { max-width: 1240px; padding: 28px; }

/* Piezas comunes */
.kicker { color: var(--blue-2); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.h1 { margin-top: 4px; color: var(--ink); font-size: 26px; font-weight: 800; line-height: 1.2; letter-spacing: -.4px; }
.lede { margin-top: 6px; max-width: 760px; color: var(--muted); }
.card { padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--board); }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 17px; font-weight: 800; }
.card h3 { font-size: 15px; font-weight: 800; }
.sub { margin-top: 3px; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.split > *, .grid2 > *, .grid3 > * { min-width: 0; }
.card, .adj, .note { overflow-wrap: anywhere; }
.adj .chip, .decision .chip { white-space: normal; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.blue { background: var(--soft-blue); border-color: transparent; color: var(--blue); }
.chip.green { background: var(--soft-green); border-color: transparent; color: var(--green); }
.chip.orange { background: var(--soft-orange); border-color: transparent; color: var(--orange); }
.chip.red { background: var(--soft-red); border-color: transparent; color: var(--red); }
.bar { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transition: width .6s; }
.avatars { display: flex; }
.av { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--board); background: var(--soft-blue); color: var(--blue); font-size: 10px; font-weight: 800; flex: none; }
.avatars .av + .av { margin-left: -7px; }
.av.lg { width: 36px; height: 36px; font-size: 12px; }
.person { display: flex; align-items: center; gap: 9px; }
.person strong { display: block; font-size: 13px; }
.person small { display: block; color: var(--muted); font-size: 11px; }
.empty { padding: 26px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center; }
.note-box { padding: 12px 14px; border-left: 4px solid var(--brand); border-radius: 0 8px 8px 0; background: var(--soft-blue); font-size: 13px; }
.note-box.green { border-color: var(--green); background: var(--soft-green); }
.note-box.orange { border-color: var(--orange); background: var(--soft-orange); }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; font-weight: 700; color: var(--blue); }
.field input, .field select, .field textarea, .inp { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
textarea { resize: vertical; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { color: var(--muted); font-size: 11px; font-weight: 800; text-align: left; text-transform: uppercase; letter-spacing: .05em; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Proyectos */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; margin-top: 16px; }
.pcard { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--line); border-top: 5px solid var(--brand); border-radius: 10px; background: var(--board); color: var(--ink); text-decoration: none; }
.pcard:hover { border-color: var(--blue-2); }
.pcard.sintetico { border-top-color: #8D7AE6; }
.pcard.seguimiento { border-top-color: var(--green); }
.pcard h3 { font-size: 16px; font-weight: 800; }
.pstate { display: grid; gap: 6px; font-size: 12px; }
.todo-strip { display: grid; gap: 8px; margin-top: 18px; }
.todo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--board); }

/* Carril de etapas */
.rail { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin-top: 18px; }
.step { flex: 0 0 150px; display: grid; gap: 6px; align-content: start; min-height: 98px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--board); color: var(--ink); text-align: left; cursor: pointer; }
.step:hover { border-color: var(--blue-2); }
.step[aria-current="step"] { outline: 2px solid var(--brand); outline-offset: 1px; }
.step .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 11px; font-weight: 800; }
.step strong { font-size: 12px; line-height: 1.3; }
.step small { color: var(--muted); font-size: 11px; }
.step.hecha { background: var(--soft-green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.step.hecha .n { background: var(--green); border-color: var(--green); color: #fff; }
.step.revision { background: var(--soft-orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
.step.revision .n { background: var(--orange); border-color: var(--orange); color: #fff; }
.step.pensando { background: var(--soft-blue); }
.step.detenido { background: var(--soft-orange); border-style: dashed; }
.step.pensando .n, .step.vivo .n { background: var(--brand); border-color: var(--brand); color: #fff; }
.step.humana .n { border-style: dashed; }
.step[disabled] { opacity: .5; cursor: not-allowed; }
.step .n svg { width: 14px; height: 14px; }
.st-ico { display: inline-flex; align-items: center; gap: 4px; }
.st-ico svg { width: 12px; height: 12px; flex: none; }
.st-ico .pulse i { width: 5px; height: 5px; }

/* Etapa */
.thinking { display: grid; gap: 14px; padding: 22px; border-radius: 10px; background: var(--soft-blue); }
.pulse { display: inline-flex; gap: 5px; }
.pulse i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s infinite ease-in-out; }
.pulse i:nth-child(2) { animation-delay: .2s; } .pulse i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pulse i { animation: none; opacity: .8; } .bar > i { transition: none; } }
.checklist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; }
.checklist li::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--line); }
.checklist li.done::before { border-color: var(--green); background: var(--green); }
.checklist li.now::before { border-color: var(--brand); }
.checklist li.done { color: var(--muted); }
ul.plain { margin: 8px 0 0; padding-left: 18px; }
ul.plain li + li { margin-top: 4px; }

.adj { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--board); }
.adj + .adj { margin-top: 10px; }
.adj.aceptado { border-left: 4px solid var(--green); }
.adj.rechazado { border-left: 4px solid var(--red); }
.adj.backlog { border-left: 4px solid var(--muted); }
.adj h4 { font-size: 14px; font-weight: 800; }
.adj dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 13px; }
.adj dt { color: var(--muted); font-weight: 700; }
.adj dd { margin: 0; }
.decision { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; }
.internal { padding: 10px 12px; border: 1px dashed var(--orange); border-radius: 8px; background: var(--soft-orange); font-size: 12px; }
.internal b { color: var(--orange); }

.variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.variant { display: grid; gap: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--board); }
.variant.elegida { border-color: var(--brand); box-shadow: 0 0 0 4px var(--soft-blue); }
.variant svg { width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }

.notes { display: grid; gap: 10px; }
.note { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; }
.note header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
.note header strong { color: var(--ink); }
.feed { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; font-size: 12px; }
.feed li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.feed time { display: block; color: var(--muted); font-size: 11px; }

/* Asistente */
.stepper { display: flex; gap: 6px; margin: 18px 0; padding: 0; list-style: none; flex-wrap: wrap; }
.stepper li { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700; }
.stepper li[aria-current="step"] { background: var(--soft-blue); border-color: transparent; color: var(--blue); }
.stepper li.ok { color: var(--green); }
.paso-btn { all: unset; cursor: pointer; } .paso-btn:hover { text-decoration: underline; } .paso-btn:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.type { display: grid; gap: 8px; align-content: start; padding: 18px; border: 2px solid var(--line); border-radius: 10px; background: var(--board); text-align: left; cursor: pointer; }
.type[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 4px var(--soft-blue); }
.type h3 { color: var(--blue); font-size: 16px; font-weight: 800; }
.type ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
.drop { display: grid; place-items: center; gap: 6px; min-height: 130px; padding: 18px; border: 2px dashed var(--line); border-radius: 10px; background: var(--panel); text-align: center; cursor: pointer; }
.drop.over { border-color: var(--brand); background: var(--soft-blue); }
.detected { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.det { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; }
.det.si { border-color: color-mix(in srgb, var(--green) 45%, transparent); background: var(--soft-green); }
.members-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }

/* Seguimiento */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--board); }
.kpi span { display: block; color: var(--muted); font-size: 12px; }
.kpi strong { display: block; margin-top: 2px; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 11px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--board); box-shadow: 0 4px 14px rgb(0 0 0 / .12); font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); }
code.snippet { display: block; padding: 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
.switch { position: relative; width: 40px; height: 22px; border-radius: 11px; border: 0; background: var(--line); cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { left: 21px; }

/* Canvas del proyecto completo (viene de work/synthetica-canvas.html) */
.cv { margin-top: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--board); }
.cv-hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.cv-hero h2 { color: var(--blue); font-size: 20px; font-weight: 800; }
.cv-hero p { margin-top: 4px; max-width: 760px; color: var(--muted); font-size: 12px; }
.cv-sum { display: flex; gap: 18px; flex: none; }
.cv-sum strong { display: block; color: var(--blue); font-size: 17px; font-weight: 800; }
.cv-sum span { color: var(--muted); font-size: 11px; }
.cv-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cv-jumps { display: flex; flex-wrap: wrap; gap: 6px; }
.cv-jump { min-height: 32px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--board); color: var(--blue); font-size: 11px; font-weight: 700; cursor: pointer; }
.cv-jump.hecha { border-color: color-mix(in srgb, var(--green) 50%, transparent); color: var(--green); }
.cv-jump.revision { background: var(--soft-orange); border-color: transparent; color: var(--orange); }
.cv-jump.pensando { background: var(--soft-blue); border-color: transparent; }
.cv-zoom { display: flex; align-items: center; gap: 6px; }
.cv-zoom span { min-width: 44px; text-align: center; color: var(--muted); font-size: 11px; font-weight: 700; }
.cv-view { position: relative; height: 640px; overflow: hidden; background-color: var(--board); background-image: radial-gradient(color-mix(in srgb, var(--muted), transparent 60%) 1px, transparent 1px); background-size: 20px 20px; touch-action: none; user-select: none; cursor: grab; }
.cv-view.drag { cursor: grabbing; }
.cv-world { position: absolute; left: 0; top: 0; width: 7100px; height: 640px; transform-origin: 0 0; }

/* ------------------------------------------------ Cuentas y sesión
   En la maqueta la contraseña se guarda como SHA-256 con sal (nunca en texto plano).
   En producción: un proveedor de sesión (Clerk o Auth.js) con Argon2 o bcrypt. */
async function hashClave(clave, sal) {
  const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sal + ':' + clave));
  return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* Adjuntos. Con `python servidor.py` (http://localhost) cada archivo se guarda en disco, en
   work/synthetica-plataforma/proyectos/<carpeta del proyecto>/fuentes/, junto con la ficha
   del proyecto. Abierta con doble clic (file://) la página no puede escribir en el disco, así
   que los guarda en el navegador (IndexedDB) y lo avisa. */
// Se decide al arrancar preguntando a api/estado: en Vercel (o con doble clic) no hay servidor local.
let SERVIDOR = false;
const slug = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
function carpetaDe(dueno) {
  if (dueno.startsWith('b-')) return 'borrador-' + dueno.toLowerCase();
  const p = proyecto(dueno);
  return `${slug(p ? p.nombre : '') || 'proyecto'}-${dueno.toLowerCase()}`;
}
const rutaCarpeta = dueno => dueno.startsWith('b-') ? `proyectos/borradores/${carpetaDe(dueno)}` : `proyectos/${carpetaDe(dueno)}`;
const AdjuntosServidor = {
  listar: dueno => fetch(`api/adjuntos?dueno=${encodeURIComponent(carpetaDe(dueno))}`).then(r => r.ok ? r.json() : []).catch(() => []),
  guardar: (dueno, files, clase = 'fuente') => Promise.all(files.map(f => fetch(`api/adjuntos?dueno=${encodeURIComponent(carpetaDe(dueno))}&nombre=${encodeURIComponent(f.name)}&clase=${clase}`, { method: 'POST', body: f })))
    .catch(() => toast('No se pudieron guardar los archivos en la carpeta del proyecto.')),
  mover: (de, a) => fetch(`api/mover?de=${encodeURIComponent(carpetaDe(de))}&a=${encodeURIComponent(carpetaDe(a))}`, { method: 'POST' }).catch(() => {}),
  copiar: (de, a) => fetch(`api/copiar?de=${encodeURIComponent(carpetaDe(de))}&a=${encodeURIComponent(carpetaDe(a))}`, { method: 'POST' }).catch(() => {}),
  borrar: dueno => fetch(`api/adjuntos?dueno=${encodeURIComponent(carpetaDe(dueno))}`, { method: 'DELETE' }).catch(() => {})
};
const AdjuntosNavegador = (() => {
  let dbp = null;
  const abrir = () => dbp || (dbp = new Promise((ok, mal) => {
    try {
      const r = indexedDB.open('synthetica-adjuntos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('archivos', { keyPath: 'id' }).createIndex('dueno', 'dueno');
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    } catch (e) { mal(e); }
  }));
  const tx = async (modo, fn) => {
    const db = await abrir();
    return new Promise((ok, mal) => { const t = db.transaction('archivos', modo); const req = fn(t.objectStore('archivos')); t.oncomplete = () => ok(req && 'result' in req ? req.result : undefined); t.onerror = () => mal(t.error); });
  };
  const crudo = dueno => tx('readonly', st => st.index('dueno').getAll(dueno)).catch(() => []);
  return {
    listar: async dueno => (await crudo(dueno)).map(x => ({ ...x, url: URL.createObjectURL(x.blob) })),
    guardar: (dueno, files, clase = 'fuente') => files.length ? tx('readwrite', st => { files.forEach(f => st.put({ id: `${dueno}:${Date.now()}:${Math.random().toString(36).slice(2)}`, dueno, clase, nombre: f.name, tipo: f.type, bytes: f.size, fecha: new Date().toISOString(), blob: f })); }).catch(() => toast('No se pudieron guardar los archivos en este navegador.')) : Promise.resolve(),
    mover: async (de, a) => { const xs = await crudo(de); if (xs.length) await tx('readwrite', st => { xs.forEach(x => { st.delete(x.id); st.put({ ...x, dueno: a }); }); }); },
    copiar: async (de, a) => { const xs = await crudo(de); if (xs.length) await tx('readwrite', st => { xs.forEach(x => st.put({ ...x, id: `${a}:${Date.now()}:${Math.random().toString(36).slice(2)}`, dueno: a })); }); },
    borrar: async dueno => { const xs = await crudo(dueno); if (xs.length) await tx('readwrite', st => { xs.forEach(x => st.delete(x.id)); }); }
  };

// Cada llamada usa el almacén que corresponde según haya o no servidor.
const Adjuntos = new Proxy({}, { get: (_, k) => (SERVIDOR ? AdjuntosServidor : AdjuntosNavegador)[k] });

}

/* ------------------------------------------------ Conexión con el motor
   datos-motor.js lo escribe conector_motor.py leyendo _agentes_sinteticos
   (solo lectura). Un proyecto sintético guarda { motor: { proyecto_id, estudio } }:
   sus etapas muestran la cohorte, la ejecución y los hallazgos reales, y cada
   hallazgo es un ajuste que una persona del proyecto valida con su nombre. */
const MOTOR = window.SYNTHETICA_MOTOR || null;
const motorProyecto = id => MOTOR && MOTOR.proyectos.find(x => x.id === id);
const estudiosDe = id => MOTOR ? MOTOR.estudios.filter(e => e.proyecto_id === id) : [];
const estudioDe = p => {
  if (!p.motor) return null;
  const es = estudiosDe(p.motor.proyecto_id);
  return es.find(e => e.carpeta === p.motor.estudio) || es[es.length - 1] || null;
};
const TIPO_GRUPO = { contraste_insuficiente: 'ergonomia', texto_pequeno: 'ergonomia', objetivo_visto_tarde: 'ergonomia', competencia_visual: 'ergonomia',
  objetivos_tactiles_pequenos: 'accesibilidad', termino_sin_explicar: 'contenido', duda_de_comprension: 'contenido', tarea_no_completada: 'flujo',
  control_incoherente: 'usabilidad', objetivo_lejano: 'usabilidad', parece_pulsable: 'usabilidad', obliga_a_recordar: 'conducta', control_cambia_de_lugar: 'usabilidad' };
const SEV = { P0: 4, P1: 3, P2: 2, P3: 1 };
const ARREGLO = { bajo: 'alta', medio: 'media', alto: 'baja' };
function validadorPara(p, validacion) {
  const de = r => p.miembros.filter(m => m.rol === r).map(m => m.persona);
  // Lo que el motor verifica solo lo confirma el equipo Synthetica; lo que depende
  // de cómo entienden o deciden personas reales lo valida alguien del proyecto.
  if (validacion === 'automatica') return de('synthetica').find(x => x === 'p8') || de('synthetica')[0] || null;
  return de('evaluacion')[0] || de('responsable')[0] || null;
}
function proyectoDesdeMotor(mp, extra = {}) {
  const es = estudiosDe(mp.id); const est = es[es.length - 1];
  const f = new Date(est.fecha_hora).getTime(); const t = m => new Date(f + m * MIN).toISOString();
  const durMin = Math.max(1, Math.round((est.duracion_s || 60) / 60));
  const E = (n, estado, inicio, fin, x = {}) => ({ n, estado, inicio, fin, ...x });
  return Object.assign({
    id: 'm-' + mp.id, nombre: mp.nombre, tipo: 'sintetico', url: mp.url_base, creado: t(0), deriva_de: null, cliente: mp.marca || mp.nombre,
    motor: { proyecto_id: mp.id, estudio: null },
    miembros: [{ persona: 'p1', rol: 'responsable' }],
    fuentes: { archivos: [], pegado: '', enlaces: [mp.url_base], detectado: {} },
    etapas: [
      // Fuentes y cohorte se configuraron en el motor antes de ligar el proyecto:
      // no hay aprobación ni fechas que mostrar, y no se inventan.
      E(0, 'hecha', null, null, { en_motor: true }),
      E(1, 'hecha', null, null, { en_motor: true }),
      E(2, 'hecha', t(0), t(durMin), { en_motor: true }),
      E(3, 'revision', t(durMin), t(durMin))
    ]
  }, extra);
}
function sincronizarProyecto(p) {
  const est = estudioDe(p); const mp = motorProyecto(p.motor.proyecto_id);
  if (!est || !mp) return;
  const e1 = p.etapas.find(x => x.n === 1), e3 = p.etapas.find(x => x.n === 3);
  e1.logros = [`${mp.perfiles.length} perfiles, ${mp.recorridos.length} recorridos y ${mp.contextos.length} contextos de uso, leídos del motor`];
  const r = est.resumen || {};
  e3.logros = [
    `${est.hallazgos.length} hallazgos del estudio del ${fmtF(est.fecha_hora)}`,
    `${(r.por_validacion || {}).personas || 0} piden tu auditoría: dependen de cómo entienden o deciden las personas reales`,
    `${est.limites.length} pasos no se pudieron medir y no se atribuyen al producto`
  ];
  const ids = new Set(est.hallazgos.map(h => h.id));
  for (const h of est.hallazgos) {
    let a = DB.ajustes.find(x => x.proyecto === p.id && x.hallazgo_ref === h.id);
    if (!a) { a = { id: 'h-' + p.id + '-' + h.id, proyecto: p.id, hallazgo_ref: h.id, estado: 'pendiente', decidido_por: null, decidido_en: null, comentario: '', validador: null }; DB.ajustes.push(a); }
    Object.assign(a, {
      etapa: 3, grupo: TIPO_GRUPO[h.tipo] || 'usabilidad',
      control: h.control ? `«${h.control}» · ${h.vista}` : `${h.vista} · ${h.titulo}`,
      titulo: h.titulo, vimos: (h.evidencia || []).join(' · ') || h.titulo, por_que: (h.por_que || []).join(' '), resultado_paso: h.resultado_paso || '', propuesta: h.recomendacion, criterio: h.criterio, validacion: h.validacion,
      donde: [h.vista, h.recorrido].filter(Boolean).join(' · '),
      evidencia: `${h.afectados} de ${h.expuestos} agentes` + (h.dispositivos.length ? ` · ${h.dispositivos.join(' y ')}` : ''),
      quick_win: h.quick_win, estudio: est.carpeta, fuera: false,
      int: { sev: SEV[h.severidad] || 1, arr: ARREGLO[h.esfuerzo] || 'media', frec: `${h.afectados}/${h.expuestos}`, p: h.severidad }
    });
    if (!a.validador || !rolDe(p, a.validador)) a.validador = validadorPara(p, h.validacion);
  }
  DB.ajustes.filter(a => a.proyecto === p.id && a.hallazgo_ref && !ids.has(a.hallazgo_ref)).forEach(a => { a.fuera = true; });
}
function sincronizarMotor() {
  if (!MOTOR) return;
  for (const mp of MOTOR.proyectos) {
    if (!estudiosDe(mp.id).length || DB.proyectos.some(x => x.id === 'm-' + mp.id)) continue;
    DB.proyectos.unshift(proyectoDesdeMotor(mp));

/* Vueltas de una caja: cada «pedir otra vuelta» abre una nueva, más corta que la anterior. */
const rondas = e => e.rondas || (e.rondas = [{ n: 1, inicio: e.inicio, fin: e.fin, min: null, respuestas: {} }]);
const rondaActual = e => { const r = rondas(e); return r[r.length - 1]; };
const minEtapa = (p, e) => (e.estado === 'pensando' && rondaActual(e).min) || defEtapa(p, e.n).min;
function progresoEtapa(p, e) {
  if (e.estado === 'detenido' && e.pausa) return { pct: e.pausa.pct, restante: e.pausa.restante, fin: null };
  const m = minEtapa(p, e);
  if (e.estado !== 'pensando' || !m) return null;
  const pas = (Date.now() - new Date(e.inicio)) / MIN;
  return { pct: Math.min(99, Math.max(1, pas / m * 100)), restante: Math.max(0, m - pas), fin: new Date(new Date(e.inicio).getTime() + m * MIN).toISOString() };
}

function avisar(pid, a, asunto) {

function progresoProyecto(p) {
  const et = catalogo(p).filter(e => e.min);
  const total = et.reduce((a, e) => a + e.min, 0);
  let hecho = 0, restante = 0;
  for (const d of et) {
    const e = p.etapas.find(x => x.n === d.n);
    if (['hecha', 'revision', 'vivo'].includes(e.estado)) hecho += d.min;
    else if (e.estado === 'pensando' || e.estado === 'detenido') { const pr = progresoEtapa(p, e); hecho += Math.max(0, d.min - pr.restante); restante += pr.restante; }
    else restante += d.min;
  }
  if (p.etapas.some(e => e.estado === 'vivo')) return { pct: 100, restante: 0 };
  return { pct: Math.round(hecho / total * 100), restante };
}

/* Motor simulado: cuando una etapa «pensando» cumple su tiempo promedio, pasa sola a revisión. */
function completarEtapa(p, e) {
  const d = defEtapa(p, e.n);
  e.fin = new Date().toISOString();
  if (d.modo === 'vivo' || (p.tipo === 'seguimiento' && e.n === 1)) {
    e.estado = 'hecha'; const sig = p.etapas.find(x => x.n === 2); sig.estado = 'vivo'; sig.inicio = e.fin;
    return;
  }
  if (p.tipo === 'sintetico' && e.n < 3) {
    // Fuentes, cohorte y ejecución se aprueban solas; el informe es el que se audita.
    e.estado = 'hecha'; e.auto = true; e.pedida = null;
    const sig = p.etapas.find(x => x.n === e.n + 1);
    if (sig) Object.assign(sig, { estado: 'pensando', inicio: e.fin, fin: null });
    return;
  }
  e.estado = 'revision';
  const r = rondaActual(e); r.fin = e.fin;
  if (p.tipo === 'completo') {

function detener(pid) {

function reanudar(pid) {

    Object.assign(e, { estado: 'pensando', inicio: new Date(Date.now() - Math.max(0, m - pa.restante) * MIN).toISOString() });

}

const aBase64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.readAsDataURL(blob); });
async function exportarTodo() {
  const duenos = [...DB.proyectos.map(p => p.id), ...(DB.borradores || []).map(b => b.id)];
  const archivos = [];
  for (const d of duenos) for (const x of await Adjuntos.listar(d)) {
    const blob = x.blob || await fetch(x.url).then(r => r.blob());
    archivos.push({ dueno: d, nombre: x.nombre, clase: x.clase, tipo: x.tipo || blob.type, fecha: x.fecha, base64: await aBase64(blob) });
  }
  const datos = { formato: 'synthetica-exportacion', version: 1, fecha: new Date().toISOString(), db: DB, archivos };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(datos)], { type: 'application/json' }));
  a.download = `synthetica-exportacion-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`; a.click();
  toast(`Exportados ${DB.proyectos.filter(p => !p.motor).length} proyectos y ${archivos.length} archivos. Ahora impórtalos en la versión con servidor.`);
}
async function importarTodo(file) {
  let datos; try { datos = JSON.parse(await file.text()); } catch (e) { return toast('Ese archivo no es una exportación de Synthetica.'); }
  if (datos.formato !== 'synthetica-exportacion') return toast('Ese archivo no es una exportación de Synthetica.');
  const src = datos.db; let nuevos = 0;
  const unir = (lista, clave) => { DB[lista] = DB[lista] || []; (src[lista] || []).forEach(x => { const i = DB[lista].findIndex(y => clave(y) === clave(x)); if (i < 0) DB[lista].push(x); else if (lista === 'ajustes' && x.auditoria && !DB[lista][i].auditoria) DB[lista][i].auditoria = x.auditoria; }); };
  (src.proyectos || []).forEach(x => { const i = DB.proyectos.findIndex(y => y.id === x.id); if (i < 0) { DB.proyectos.unshift(x); nuevos++; } else if (!x.motor) DB.proyectos[i] = x; });
  unir('ajustes', x => x.id); unir('notas', x => x.id); unir('borradores', x => x.id); unir('variantes', x => x.id);
  unir('elecciones', x => `${x.proyecto}:${x.etapa}:${x.persona}`); unir('correos', x => `${x.proyecto}:${x.fecha}:${x.asunto}`);
  for (const a of datos.archivos || []) {
    const bytes = Uint8Array.from(atob(a.base64), c => c.charCodeAt(0));
    await Adjuntos.guardar(a.dueno, [new File([bytes], a.nombre, { type: a.tipo || 'application/octet-stream' })], a.clase || 'fuente');
  }
  DB.proyectos.forEach(p => { const c = (DB.correos || []).find(x => x.proyecto === p.id); if (!p.motor || c) guardarFicha(p, c || null); });
  save(); render(); toast(`Importados ${nuevos} proyectos y ${(datos.archivos || []).length} archivos a sus carpetas.`);
}

        <a class="btn small" href="mailto:${c.para}?subject=${encodeURIComponent(c.asunto)}&body=${encodeURIComponent(c.cuerpo)}">Abrir en tu correo</a></details>`).join('') || '<p class="small muted" style="margin-top:8px">Todavía no se ha enviado ninguno.</p>'}</div>` : ''}`;
}

/* ---- Proyecto */
function vistaProyecto(pid, nSel) {
  const p = proyecto(pid);
  if (!p) return '<div class="empty">Ese proyecto no existe.</div>';
  if (p.tipo === 'completo' && nSel == null) return vistaCanvas(p);
  const cur = actual(p);
  const n = nSel != null ? +nSel : (UI.etapaVista[pid] ?? cur.n);
  const e = p.etapas.find(x => x.n === n) || cur;
  const pr = progresoProyecto(p); const st = estadoTexto(p);
  const origen = p.deriva_de ? proyecto(p.deriva_de) : null;
  const hijos = DB.proyectos.filter(x => x.deriva_de === p.id);
  const banner = UI.recienCreado === p.id && p.tipo !== 'completo' && !p.cancelado ? `<div class="note-box green" style="margin-top:16px"><strong>Tu proyecto está en camino.</strong> Recibimos tus fuentes y ya las estamos leyendo. Te avisaremos cuando el informe esté listo para auditar.</div>` : '';
  return `
    <div class="row between" style="align-items:flex-start">
      <div>
        <p class="kicker">${TIPOS[p.tipo].nombre}</p>
        <h1 class="h1">${esc(p.nombre)}</h1>
        <p class="sub">${p.url ? `<a href="${esc(p.url)}" rel="noopener" target="_blank">${esc(p.url)}</a> · ` : ''}Creado el ${fmtF(p.creado)}${origen ? ` · Rehace <a href="#/p/${origen.id}">«${esc(origen.nombre)}»</a>` : ''}${hijos.map(h => ` · Rehecho en <a href="#/p/${h.id}">«${esc(h.nombre)}»</a>`).join('')}</p>
      </div>
      <div style="min-width:240px">
        <div class="row between small"><span>${st.chip}</span><span class="muted">${pr.pct}%</span></div>
        <div class="bar" style="margin-top:6px" role="progressbar" aria-valuenow="${pr.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avance del proyecto"><i data-proy="${p.id}" style="width:${pr.pct}%"></i></div>
        <p class="small muted" style="margin-top:4px">${pr.restante && !p.cancelado && !detenida(p) ? `Faltan unas ${dur(pr.restante)} de proceso` : esc(st.linea)}</p>
        ${accionesHTML(p)}
      </div>
    </div>
    ${banner}${avisoCancelado(p)}
    ${p.tipo === 'completo' ? `<div class="row" style="margin-top:14px"><a class="btn small" href="#/p/${p.id}">← Volver al canvas</a><span class="small muted">Estás viendo el detalle de un escenario: lo que logramos, lo que hay que validar y sus notas.</span></div>` : ''}
    <div class="rail" role="list" aria-label="Etapas del proyecto">${p.etapas.map(x => {
      const d = defEtapa(p, x.n); const prx = progresoEtapa(p, x);
      const sint = p.tipo === 'sintetico';
      const lab = { hecha: sint ? 'Lista' : 'Aprobada', revision: sint ? 'Tu momento de auditar' : 'Tu momento de revisar', pensando: prx ? `Pensando · ${Math.round(prx.pct)}%` : 'Pensando', cola: d.min ? `En espera · ≈ ${dur(d.min)}` : 'Tu equipo', humana: 'Tarea de tu equipo', vivo: 'En vivo', analista: 'Esperando al analista', detenido: `Detenido · ${Math.round((x.pausa || {}).pct || 0)} %` }[x.estado];
      const ico = { hecha: ICON.ok, revision: ICON.auditar, pensando: '<span class="pulse" aria-hidden="true"><i></i><i></i><i></i></span>', cola: ICON.espera, humana: ICON.persona, analista: ICON.persona, vivo: '●', detenido: ICON.pausa }[x.estado];
      return `<button role="listitem" class="step ${x.estado} ${d.modo === 'humana' ? 'humana' : ''}" data-step="${x.n}" ${x.n === e.n ? 'aria-current="step"' : ''}><span class="n">${x.n}</span><strong>${esc(d.corto)}</strong><small class="st-ico">${ico} ${lab}</small></button>`;
    }).join('')}

      return `<button role="listitem" class="step" data-reejecutar="${p.id}" ${corriendo ? 'disabled title="Ya hay una ejecución en curso"' : ''}><span class="n">${ICON.repetir}</span><strong>Volver a ejecutar</strong><small>${p.cancelado ? 'Proyecto cancelado' : corriendo ? 'Ejecución en curso' : 'Eliges cuántos agentes'}</small></button>`; })() : ''}</div>

  return `

function wireCanvas() {
  const view = document.getElementById('cv-view'); if (!view) return;
  const world = document.getElementById('cv-world'); const pid = view.dataset.proyecto;
  const WIDTH = 7100, left = n => 330 + (n - 1) * 710;
  const st = UI.cv[pid] || (UI.cv[pid] = { scale: 0.8, x: null, y: 16 });
  const apply = () => { world.style.transform = `translate(${st.x}px, ${st.y}px) scale(${st.scale})`; const z = document.getElementById('cv-zv'); if (z) z.textContent = Math.round(st.scale * 100) + '%'; };
  const jump = n => { st.scale = Math.max(st.scale, 0.7); st.x = view.clientWidth / 2 - (left(n) + 280) * st.scale; st.y = 16; apply(); };
  const scaleTo = v => { const o = st.scale; st.scale = Math.max(0.15, Math.min(1.3, v)); const cx = view.clientWidth / 2, cy = view.clientHeight / 2; st.x = cx - (cx - st.x) / o * st.scale; st.y = cy - (cy - st.y) / o * st.scale; apply(); };
  if (st.x == null) jump(+view.dataset.actual); else apply();
  let drag = null;
  view.addEventListener('pointerdown', ev => { if (ev.target.closest('a,button')) return; drag = { cx: ev.clientX, cy: ev.clientY, x: st.x, y: st.y }; view.setPointerCapture(ev.pointerId); view.classList.add('drag'); });
  view.addEventListener('pointermove', ev => { if (!drag) return; st.x = drag.x + ev.clientX - drag.cx; st.y = drag.y + ev.clientY - drag.cy; apply(); });
  const end = ev => { if (!drag) return; drag = null; view.classList.remove('drag'); if (view.hasPointerCapture(ev.pointerId)) view.releasePointerCapture(ev.pointerId); };
  view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
  view.addEventListener('wheel', ev => { ev.preventDefault(); if (ev.ctrlKey) scaleTo(st.scale * (ev.deltaY > 0 ? 0.9 : 1.1)); else { st.x -= ev.deltaX || ev.deltaY; apply(); } }, { passive: false });
  document.querySelectorAll('[data-cvjump]').forEach(b => b.onclick = () => jump(+b.dataset.cvjump));
  document.querySelectorAll('[data-cvzoom]').forEach(b => b.onclick = () => scaleTo(st.scale + +b.dataset.cvzoom));
  document.querySelectorAll('[data-cvfit]').forEach(b => b.onclick = () => { st.scale = Math.max(0.12, (view.clientWidth - 36) / WIDTH); st.x = 18; st.y = Math.max(18, (view.clientHeight - 640 * st.scale) / 2); apply(); });
}

function etapaHTML(p, e) {
  const d = defEtapa(p, e.n);
  const cab = `<div class="row between"><div><p class="kicker">Etapa ${e.n}${p.tipo === 'completo' && e.n ? ' · escenario ' + e.n : ''}</p><h2 style="font-size:20px;font-weight:800">${esc(d.nombre)}</h2></div><span class="chip">${d.rango ? 'Primera vuelta: ' + d.rango : d.min ? 'Tiempo promedio ' + dur(d.min) : 'La hace tu equipo'}</span></div>`;
  if (e.estado === 'pensando') {
    const pr = progresoEtapa(p, e);
    const k = Math.floor(pr.pct / 100 * d.hace.length);
    return `<div class="card">${cab}
      <div class="thinking" style="margin-top:14px">
        <div class="row"><span class="pulse" aria-hidden="true"><i></i><i></i><i></i></span><strong>Synthetica está pensando</strong></div>
        <div class="bar" role="progressbar" aria-valuenow="${Math.round(pr.pct)}" aria-valuemin="0" aria-valuemax="100" aria-label="Avance de la etapa"><i data-etapa="${p.id}:${e.n}" style="width:${pr.pct}%"></i></div>
        <p class="small">Empezó ${fmtF(e.inicio)}${rondas(e).length > 1 ? `, vuelta ${rondas(e).length}` : ''}. ${rondas(e).length > 1 ? `Como ya conocemos tu producto, esta vuelta tarda unas ${dur(minEtapa(p, e))}` : `${p.tipo === 'completo' ? 'Este escenario' : 'Esta etapa'} tarda ${esc(d.rango || 'en promedio ' + dur(d.min))}`}; debería estar lista hacia <strong>${fmtH(pr.fin)}</strong>. Te escribiremos en cuanto esté lista.</p>
        <ul class="checklist">${d.hace.map((h, i) => `<li class="${i < k ? 'done' : i === k ? 'now' : ''}">${esc(h)}</li>`).join('')}</ul>
      </div>
      ${(e.n === 0 && p.tipo === 'sintetico' && !p.motor) || (e.n === 1 && p.tipo === 'completo') ? `<h3 style="margin-top:16px">Lo que nos diste</h3>${entradasHTML(p)}` : ''}
      <p class="small muted" style="margin-top:12px">Mientras tanto puedes dejar notas: las leemos antes de cerrar la etapa.</p>
      ${interna() ? `<div class="internal" style="margin-top:12px"><b>Interno.</b> Corrida del motor ligada a esta etapa: <code>${p.id}-e${e.n}</code>. ${p.tipo === 'sintetico' ? 'Motor completo: KLM, grabación y mirada simulada.' : 'Motor ligero: 3–5 agentes, sin KLM ni grabación.'}</div>` : ''}
      <div class="row" style="margin-top:14px"><button class="btn small" data-adelantar="${p.id}" title="Solo en la maqueta">Adelantar el tiempo (maqueta)</button></div>
    </div>`;
  }
  if (e.estado === 'detenido') return `<div class="card">${cab}
      <div class="thinking" style="margin-top:14px;background:var(--soft-orange)">
        <div class="row">${ICON.pausa.replace('<svg', '<svg width="16" height="16" style="color:var(--orange)"')}<strong>Detenido el ${fmtF(e.pausa.fecha)}</strong></div>
        <div class="bar" aria-hidden="true"><i style="width:${e.pausa.pct}%;background:var(--orange)"></i></div>
        <p class="small">${e.pausa.desde === 'analista' ? 'Todavía no había arrancado.' : `Iba en ${Math.round(e.pausa.pct)} %.`} Al reanudar, sigue donde quedó${e.pausa.restante ? `: faltan unas ${dur(e.pausa.restante)}` : ''}.</p>
        ${p.cancelado ? '' : `<div class="row"><button class="btn small primary" data-reanudar="${p.id}">Reanudar</button></div>`}
      </div></div>`;
  if (e.estado === 'cola') {
    const prev = defEtapa(p, e.n - 1);
    return `<div class="card">${cab}<p class="sub" style="margin-top:8px">Empieza cuando se apruebe «${esc(prev ? prev.nombre : '')}». Las etapas van siempre en orden: ninguna se puede saltar.</p>
      <h3 style="margin-top:16px">Qué haremos</h3><ul class="plain">${d.hace.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
      <h3 style="margin-top:16px">Qué recibirás</h3><p class="sub">${esc(d.entrega)}</p></div>`;
  }
  if (e.estado === 'humana') return humanaHTML(p, e, d, cab);
  if (e.estado === 'analista' && e.pedida) return `<div class="card">${cab}
      <div class="thinking" style="margin-top:14px"><strong>Pediste ${e.pedida.desde_inicio ? 'volver a empezar el estudio' : 'una nueva ejecución'} con ${e.pedida.agentes} ${e.pedida.agentes === 1 ? 'agente' : 'agentes'}</strong>
        <ul class="checklist"><li class="done">Solicitud registrada el ${fmtF(e.pedida.fecha)}${(e.pedida.fuentes || []).length + (e.pedida.enlaces || []).length ? `, con ${(e.pedida.fuentes || []).length + (e.pedida.enlaces || []).length} fuentes nuevas` : ''}</li><li class="done">Avisamos al equipo por correo</li><li class="now">Un analista la lanza desde la consola y valida que todo funcione</li><li>${e.pedida.desde_inicio ? 'Se leen las fuentes, se arman la cohorte y los recorridos, se ejecuta y ' : 'Después '}se arma el informe nuevo para que lo audites</li></ul></div>
      ${(e.pedida.fuentes || []).length ? `<h3 style="margin-top:16px">Documentos que subiste</h3><div data-adjuntos="${p.id}" style="margin-top:6px"><span class="muted small">Cargando…</span></div>` : ''}
      ${puede(p, 'interna') ? `<div class="internal" style="margin-top:14px"><b>Equipo Synthetica.</b> Córrela con la misma cohorte y recorridos. En la maqueta, este botón hace de consola.<div class="row" style="margin-top:8px"><button class="btn small primary" data-lanzar="${p.id}">Lanzar (analista)</button></div></div>` : ''}
    </div>`;
  if (e.estado === 'analista') return `<div class="card">${cab}
      <div class="thinking" style="margin-top:14px">
        <strong>Recibimos tu proyecto</strong>
        <ul class="checklist"><li class="done">Tus archivos se están procesando (tarda entre 5 y 10 minutos)</li><li class="done">Avisamos al equipo por correo: «un proyecto nuevo acaba de iniciar»</li><li class="now">Un analista pone en marcha el primer escenario desde la consola</li><li>El primer escenario tarda ${esc(d.rango || dur(d.min))}; te escribimos en cuanto esté lista</li></ul>
      </div>
      ${entradasHTML(p)}
      ${puede(p, 'interna') ? `<div class="internal" style="margin-top:14px"><b>Equipo Synthetica.</b> Lánzala desde la consola con las entradas de arriba y la credencial cifrada, si la hay. En la maqueta, este botón hace de consola.<div class="row" style="margin-top:8px"><button class="btn small primary" data-lanzar="${p.id}">Lanzar el primer escenario (analista)</button></div></div>` : ''}
    </div>`;

  const ajs = ajustesDe(p.id, e.n);
  const decididos = ajs.filter(a => a.estado !== 'pendiente').length;
  const esDiseno = d.modo === 'diseno';
  const final = DB.elecciones.find(x => x.proyecto === p.id && x.etapa === e.n && x.final);
  const conVueltas = p.tipo === 'completo' && d.modo !== 'humana';
  const bloqueo = esDiseno && !final ? 'Elige una variante para continuar.' : conVueltas && e.estado === 'revision' && !rondaActual(e).sin_dudas ? 'Marca «No tengo más dudas» para aprobar y seguir.' : '';
  const sig = defEtapa(p, e.n + 1);
  const revisando = e.estado === 'revision';
  return `<div class="card">${cab}
      <p class="sub" style="margin-top:6px">${revisando ? `Lista desde el ${fmtF(e.fin)}.` : e.auto ? `Lista el ${fmtF(e.fin)}; pasó sola a la siguiente etapa.` : e.aprobada_por ? `Aprobada por ${esc(persona(e.aprobada_por).nombre)}${e.aprobada_en ? ' el ' + fmtF(e.aprobada_en) : ''}.` : e.en_motor ? (e.inicio ? `Corrió en el motor del ${fmtF(e.inicio)} al ${fmtF(e.fin)}.` : 'Se configuró directamente en el motor, antes de ligar el proyecto a la plataforma.') : 'Terminada.'}</p>
      ${e.logros ? `<h3 style="margin-top:16px">Qué logramos</h3><ul class="plain">${e.logros.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
      ${e.prototipo ? `<div class="note-box" style="margin-top:16px"><div class="row between"><div><strong>Prueba la interfaz</strong><div class="small muted">${esc(e.prototipo)} · navegable, con los datos que nos diste</div></div><button class="btn small primary" data-probar="${p.id}:${e.n}">Abrir el prototipo</button></div></div>` : ''}
      ${e.eval ? `<h3 style="margin-top:18px">Cómo les fue a los agentes</h3>
        <p class="small muted">Evaluación ligera: ${e.eval.agentes} agentes, sin KLM ni grabaciones.</p>
        <div class="grid3" style="margin-top:8px"><div class="kpi"><span>Agentes</span><strong>${e.eval.agentes}</strong></div><div class="kpi"><span>Tareas</span><strong style="font-size:16px">${esc(e.eval.tareas)}</strong></div><div class="kpi"><span>Ajustes propuestos</span><strong>${ajs.length}</strong></div></div>
        <p style="margin-top:10px">${esc(e.eval.resumen)}</p>` : ''}
      ${p.tipo === 'sintetico' && e.n === 3 && !p.motor ? `<div class="note-box green" style="margin-top:16px"><strong>Este informe usa el motor completo.</strong> Incluye tiempos KLM por paso, grabaciones de cada agente, mirada simulada, recomendaciones UI y la auditoría experta. <span class="muted">(En la plataforma real se abre desde aquí.)</span></div>` : ''}
    </div>
    ${(e.n === 1 && p.tipo === 'completo') || (e.n === 0 && p.tipo === 'sintetico' && !p.motor) ? `<div class="card"><h2>Lo que nos diste</h2>${entradasHTML(p)}</div>` : ''}
    ${p.motor ? motorEtapaHTML(p, e) : ''}
    ${esDiseno ? disenoHTML(p, e) : ''}
    ${conVueltas ? opinionHTML(p, e) : ''}
    ${ajs.length ? auditoriaHTML(p, e, ajs) : ''}
    ${revisando && p.tipo !== 'sintetico' ? `<div class="card"><div class="row between">
      <div><h2>${sig ? `Continuar a «${esc(sig.nombre)}»` : 'Cerrar el proyecto'}</h2>
      <p class="sub">${bloqueo || 'Todo listo para seguir.'}${sig && sig.min ? ` La siguiente etapa tarda unas ${dur(sig.min)}.` : ''}</p></div>
      <button class="btn primary" data-continuar="${p.id}" ${bloqueo ? 'disabled' : ''}>Aprobar y continuar</button>
    </div></div>` : ''}`;
}

function entradasHTML(p) {
  const f = p.fuentes || {}; const en = f.entradas || {};
  const fila = (t, v) => v ? `<tr><td style="width:190px"><strong>${t}</strong></td><td>${v}</td></tr>` : '';
  const lista = t => esc(t).split(/\n+/).filter(Boolean).join('<br>');
  const html = [
    fila('Acuerdo de confidencialidad', p.consentimiento ? `Aceptado por ${esc(p.consentimiento.nombre)} (${esc(p.consentimiento.correo)}) el ${fmtF(p.consentimiento.fecha)} · versión ${esc(p.consentimiento.version)}` : ''),
    fila('Descripción', f.descripcion ? esc(f.descripcion) : ''),
    fila('Alcance', en.alcance ? esc(en.alcance) : ''), fila('Qué quieres analizar', en.analizar ? esc(en.analizar) : ''), fila('Qué esperas obtener', en.esperas ? esc(en.esperas) : ''),
    fila('Sistema de diseño / Storybook', en.storybook ? `<a href="${esc(en.storybook)}" target="_blank" rel="noopener">${esc(en.storybook)}</a>` : ''), fila('Secciones útiles', en.secciones ? esc(en.secciones) : ''),
    fila('Objetivo', en.objetivo ? esc(en.objetivo) : ''), fila('Intención y condiciones de negocio', en.intencion ? esc(en.intencion) : ''), fila('Flujo actual', en.flujo ? esc(en.flujo) : ''),
    fila('Contexto pegado', f.pegado ? esc(f.pegado) : ''),
    (f.archivos || []).length || f.manual ? `<tr><td style="width:190px"><strong>Documentos</strong></td><td><div data-adjuntos="${p.id}" data-vacio="${esc([...(f.archivos || []), f.manual].filter(Boolean).join(', ') + ' · solo quedó el nombre: estos archivos se subieron antes de que la plataforma los guardara.')}"><span class="muted small">Cargando…</span></div></td></tr>` : '',
    fila('Ignorados (no son texto)', (f.ignorados || []).length ? f.ignorados.map(esc).join(', ') : ''),
    fila('Manual de marca', f.manual ? esc(f.manual) : ''),
    fila('Código', en.github ? `<a href="${esc(en.github)}" target="_blank" rel="noopener">${esc(en.github)}</a>` : ''),
    fila('Enlaces importantes', en.enlaces ? lista(en.enlaces) : ''), fila('Competencia y referentes', en.competencia ? lista(en.competencia) : ''),
    fila('Plataforma actual', f.acceso ? `${esc(f.acceso.url || '')}${f.acceso.usuario ? ' · usuario ' + esc(f.acceso.usuario) : ''}${f.acceso.credencial ? ' · <span class="chip green">contraseña entregada, cifrada</span>' : ''}` : '')
  ].join('');
  const colores = p.paleta || PALETA_TEMPORAL;
  return `<table style="margin-top:10px"><tbody>${html || '<tr><td class="muted">Sin entradas registradas en la maqueta.</td></tr>'}
    ${p.tipo === 'completo' ? `<tr><td><strong>Colores</strong></td><td><span class="row" style="gap:6px">${colores.map(c => `<span title="${c}" style="display:inline-block;width:22px;height:22px;border-radius:4px;border:1px solid var(--line);background:${c}"></span>`).join('')}<span class="small muted">${p.paleta ? 'de tu marca' : f.manual ? 'los tomamos de tu manual de marca (en la maqueta se ven los temporales)' : 'temporales hasta que nos digas cuáles'}</span></span></td></tr>
    <tr><td><strong>Logo</strong></td><td class="small">${f.manual ? 'El de tu manual de marca.' : 'No diseñamos logos: usamos uno temporal para el proyecto.'}</td></tr>` : ''}</tbody></table>`;
}

function opinionHTML(p, e) {
  const rs = rondas(e); const r = rondaActual(e); const k = rs.length;
  const d = defEtapa(p, e.n);
  const revisando = e.estado === 'revision';
  const mia = r.respuestas[UI.actor] || {};
  const radio = (name, val, txt, cur) => `<label class="chip" style="cursor:pointer"><input type="radio" name="${name}" value="${val}" ${cur === val ? 'checked' : ''} ${revisando ? '' : 'disabled'}> ${txt}</label>`;
  const tri = (id, cur) => `<span class="row" style="gap:6px">${radio('q-' + id, 'si', 'Sí', cur)}${radio('q-' + id, 'parcial', 'En parte', cur)}${radio('q-' + id, 'no', 'No', cur)}</span>`;
  const qs = (PREGUNTAS[e.n] || []).map(([id, t]) => { const a = (mia.preguntas || {})[id] || {};
    return `<div style="padding:10px 0;border-top:1px solid var(--line)"><p><strong>${t}</strong></p><div class="row" style="margin-top:6px">${tri(id, a.v)}<input class="inp" id="qc-${id}" value="${esc(a.c || '')}" placeholder="Cuéntanos por qué (opcional)" style="flex:1;min-width:200px;min-height:34px" ${revisando ? '' : 'disabled'}></div></div>`; }).join('');
  const colores = PREG_COLORES.includes(e.n) ? (() => { const a = (mia.preguntas || {}).colores || {}; const pal = p.paleta || PALETA_TEMPORAL;
    return `<div style="padding:10px 0;border-top:1px solid var(--line)"><p><strong>¿Te gustan estos colores?</strong> <span class="row" style="display:inline-flex;gap:4px;vertical-align:middle">${pal.map(c => `<span style="display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:${c}"></span>`).join('')}</span></p>
      <div class="row" style="margin-top:6px">${tri('colores', a.v)}<input class="inp" id="qc-colores" value="${esc(a.c || '')}" placeholder="Si no, ¿cuáles prefieres?" style="flex:1;min-width:200px;min-height:34px" ${revisando ? '' : 'disabled'}></div></div>`; })() : '';
  const historial = rs.slice(0, revisando ? -1 : undefined).map(x => {
    const ops = Object.entries(x.respuestas || {});
    return `<li style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>Vuelta ${x.n}</strong> <span class="muted small">· ${x.min ? dur(x.min) : ''}${x.fin ? ' · lista el ' + fmtF(x.fin) : ''}</span>
      ${ops.map(([pid, o]) => `<div class="small" style="margin-top:4px">${esc(persona(pid).nombre)}: ${o.gusta ? (o.gusta === 'si' ? 'le gusta' : 'no le gusta') : ''}${o.cumple ? ' · ' + ({ si: 'cumple', parcial: 'cumple en parte', no: 'no cumple' })[o.cumple] : ''}${Object.values(o.preguntas || {}).filter(q => q.c).map(q => ` · «${esc(q.c)}»`).join('')}${o.dudas ? `<br><span class="muted">Duda:</span> ${esc(o.dudas)}` : ''}</div>`).join('') || '<div class="small muted">Sin opiniones registradas.</div>'}
      ${x.respuesta_equipo ? `<div class="small note-box green" style="margin-top:6px;padding:6px 10px"><strong>Respuesta:</strong> ${esc(x.respuesta_equipo)}</div>` : ''}
      ${x.sin_dudas ? `<div class="small" style="margin-top:4px">${ICON.ok.replace('<svg', '<svg width="12" height="12" style="color:var(--green)"')} ${esc(persona(x.sin_dudas.persona).nombre)} marcó «No tengo más dudas» el ${fmtF(x.sin_dudas.fecha)}</div>` : ''}</li>`;
  }).join('');
  const otros = Object.entries(r.respuestas).filter(([pid]) => pid !== UI.actor);
  const siguiente = Math.max(20, Math.round((r.min || d.min) / 2));
  const hayOpinion = Object.keys(r.respuestas).length > 0;
  return `<div class="card">
    <div class="row between"><div><h2>Tu opinión sobre esta versión</h2><p class="sub">Vuelta ${k}${k > 1 ? ` de este escenario · cada vuelta es más corta que la anterior` : ''}. Con lo que nos digas modificamos la aplicación y respondemos tus dudas, hasta que no te queden.</p></div>${r.sin_dudas ? '<span class="chip green">Sin más dudas</span>' : ''}</div>
    ${revisando ? `
    <div class="row" style="margin-top:14px;gap:16px"><div><p class="small"><strong>¿Te gusta?</strong></p><div class="row" style="gap:6px;margin-top:4px">${radio('q-gusta', 'si', 'Me gusta', mia.gusta)}${radio('q-gusta', 'no', 'No me gusta', mia.gusta)}</div></div>
      <div><p class="small"><strong>¿Cumple lo que necesitas?</strong></p><div class="row" style="gap:6px;margin-top:4px">${radio('q-cumple', 'si', 'Cumple', mia.cumple)}${radio('q-cumple', 'parcial', 'En parte', mia.cumple)}${radio('q-cumple', 'no', 'No cumple', mia.cumple)}</div></div></div>
    <div style="margin-top:12px">${qs}${colores}</div>
    <label class="field" style="margin-top:10px"><span>¿Tienes dudas sobre cómo funciona?</span><textarea id="fb-dudas" class="inp" rows="2" placeholder="Escríbelas aquí: las respondemos en la próxima vuelta">${esc(mia.dudas || '')}</textarea></label>
    <div class="row" style="margin-top:10px">${puede(p, 'notas') ? `<button class="btn small primary" data-opinion="${p.id}:${e.n}">${mia.fecha ? 'Actualizar mi opinión' : 'Guardar mi opinión'}</button>` : ''}${mia.fecha ? `<span class="small muted">Guardada el ${fmtF(mia.fecha)}</span>` : ''}</div>
    ${otros.length ? `<div class="small" style="margin-top:10px">${otros.map(([pid, o]) => `<div>${av(pid)} ${esc(persona(pid).nombre)} opinó: ${o.gusta === 'si' ? 'le gusta' : o.gusta === 'no' ? 'no le gusta' : ''}${o.dudas ? ' · tiene una duda' : ''}</div>`).join('')}</div>` : ''}
    ${puede(p, 'aprobar') ? `<div class="note-box" style="margin-top:14px">
      <label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" data-sindudas="${p.id}:${e.n}" ${r.sin_dudas ? 'checked' : ''}> <strong>No tengo más dudas</strong></label>
      <p class="small muted" style="margin-top:4px">${r.sin_dudas ? 'Ya puedes aprobar el escenario y seguir.' : `Si todavía hay algo que cambiar, pide otra vuelta con lo que nos dijeron: tardará unas ${dur(siguiente)}.`}</p>
      ${r.sin_dudas ? '' : `<div class="row" style="margin-top:8px"><button class="btn small" data-vuelta="${p.id}:${e.n}" ${hayOpinion ? '' : 'disabled title="Primero guarda al menos una opinión"'}>Pedir otra vuelta con este feedback</button></div>`}
    </div>` : ''}` : ''}
    ${historial ? `<h3 style="margin-top:16px">Vueltas anteriores</h3><ul class="feed" style="margin-top:4px">${historial}</ul>` : ''}
  </div>`;
}

function humanaHTML(p, e, d, cab) {
  if (p.tipo === 'seguimiento') {
    const tag = 'SYN-' + p.id.slice(0, 4).toUpperCase();
    return `<div class="card">${cab}
      <p class="sub" style="margin-top:6px">Pega este fragmento antes de &lt;/head&gt; en todas las páginas del producto. Solo mide uso anónimo: no guarda lo que las personas escriben.</p>
      <code class="snippet" style="margin-top:12px">&lt;script async src="https://tag.synthetica.app/s.js" data-proyecto="${tag}"&gt;&lt;/script&gt;</code>
      <div class="row" style="margin-top:14px">${puede(p, 'aprobar') ? `<button class="btn primary" data-continuar="${p.id}">Ya la instalé: comprobar</button>` : ''}<span class="small muted">En la plataforma real comprobamos que llegue la primera visita antes de seguir.</span></div></div>`;
  }
  return `<div class="card">${cab}
    <p class="sub" style="margin-top:6px">Aquí termina la construcción automática. Tu equipo decide cómo evaluar con usuarios finales; Synthetica documenta y recoge los resultados.</p>
    <h3 style="margin-top:16px">Plan de evaluación</h3>
    <ul class="checklist" style="margin-top:8px">${['Elegir las tareas a evaluar', 'Elegir instrumentos (SUS, NPS, CSAT, entrevistas)', 'Reclutar participantes reales', 'Subir resultados'].map(t => `<li>${t}</li>`).join('')}</ul>
    <p class="small muted" style="margin-top:12px">Responsables: ${p.miembros.filter(m => ['responsable', 'evaluacion'].includes(m.rol)).map(m => esc(persona(m.persona).nombre)).join(', ')}</p>
    ${puede(p, 'aprobar') ? `<div class="row" style="margin-top:14px"><button class="btn primary" data-continuar="${p.id}">Marcar la evaluación humana como terminada</button></div>` : ''}</div>`;
}

function matrizInterna(ajs) {
  const sevs = [4, 3, 2, 1], arrs = ['alta', 'media', 'baja'];
  const celda = (s, r) => ajs.filter(a => a.int && a.int.sev === s && a.int.arr === r).map(a => esc(a.control)).join('<br>') || '<span class="muted">—</span>';
  return `<div class="internal" style="margin-top:12px"><b>Vista interna · severidad × arreglabilidad.</b> El cliente no ve esta tabla; ve la lista de ajustes.
    <div style="overflow-x:auto"><table style="margin-top:8px;background:var(--board)"><thead><tr><th>Severidad</th>${arrs.map(r => `<th>Arreglo ${r}</th>`).join('')}</tr></thead>
    <tbody>${sevs.map(s => `<tr><td><strong>S${s}</strong> ${['', 'cosmética', 'menor', 'mayor', 'bloqueante'][s]}</td>${arrs.map(r => `<td>${celda(s, r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}

const RESULTADOS = { pasa: ['Pasa', 'green'], no_pasa: ['No pasa', 'red'], no_era: ['No era un problema', ''], solucionado: ['Ya está solucionado', 'green'] };
// El resultado del paso es contexto: aclara que el problema no siempre bloquea la tarea.
function resultadoPaso(t) {
  if (/^Completó el paso y entendió/.test(t)) return 'Completó el paso y entendió lo que hacía: el problema no lo bloqueó, pero le exigió más de lo necesario.';
  if (/^Completó el paso, pero/.test(t)) return t + ' El problema sumó a esa duda.';
  return t;
}
function auditoriaHTML(p, e, ajs) {
  const clave = p.id + ':' + e.n; const f = UI.filtros[clave] || (UI.filtros[clave] = { g: '', est: '', val: '' });
  const grupos = [...new Set(ajs.map(a => a.grupo))];
  const hechos = ajs.filter(a => a.auditoria).length;
  const vis = ajs.filter(a => (!f.g || a.grupo === f.g) && (!f.est || (f.est === 'hechos' ? a.auditoria : !a.auditoria)) && (!f.val || a.validacion === f.val))
    .sort((a, b) => (b.quick_win ? 1 : 0) - (a.quick_win ? 1 : 0) || (a.validacion === 'personas' ? -1 : 1) - (b.validacion === 'personas' ? -1 : 1) || ((b.int || {}).sev || 0) - ((a.int || {}).sev || 0));
  const todos = UI.abiertos[clave]; const mostrar = todos ? vis : vis.slice(0, 10);
  const chip = (g, txt, n) => `<button class="chip ${f.g === g ? 'blue' : ''}" data-fg="${clave}|${g}" aria-pressed="${f.g === g}" style="cursor:pointer">${g ? ICON[g] || '' : ''}${txt} · ${n}</button>`;
  return `<div class="card">
    <div class="row between"><div><h2>Auditoría de los hallazgos</h2><p class="sub">${hechos} de ${ajs.length} auditados. Revisa cada hallazgo, marca qué encontraste y deja un comentario si hace falta. Tu auditoría se guarda: si el hallazgo vuelve a salir en la siguiente corrida, la conserva.</p></div></div>
    <div class="grid2" style="margin-top:10px">
      <div class="note-box"><span class="chip orange">${ICON.persona}Pide tu auditoría</span><p class="small" style="margin-top:4px">Depende de cómo entienden o deciden las personas reales: el motor no puede confirmarlo solo.</p></div>
      <div class="note-box green"><span class="chip">${ICON.ok}Verificación automática</span><p class="small" style="margin-top:4px">El motor la vuelve a medir en la próxima ejecución. Auditarla es opcional.</p></div>
    </div>
    <div class="row" style="margin-top:14px;gap:6px" role="group" aria-label="Filtrar por categoría">${chip('', 'Todas', ajs.length)}${grupos.map(g => chip(g, GRUPOS[g], ajs.filter(a => a.grupo === g).length)).join('')}</div>

        <strong class="small" style="display:block;margin-top:6px">${esc(x.vista)}</strong>
        <span class="small muted">${x.dispositivo === 'movil' ? 'Móvil' : 'Escritorio'} · ${x.puntos} ${x.tipo === 'clics' ? (x.puntos === 1 ? 'clic' : 'clics') : 'fijaciones'}${x.sin_respuesta ? ` · <span style="color:var(--red)">${x.sin_respuesta} sin respuesta</span>` : ''}</span>
      </button>`).join('') || '<p class="small muted">No hay mapas para este filtro.</p>'}

function verMapa(pid, i) {

function mockScreen(estilo, nombre = 'Tu producto') {

  }[estilo];

    <rect width="300" height="300" fill="${S.bg}"/>
    <rect width="300" height="44" fill="${S.head}"/><text x="16" y="28" font-size="14" font-weight="800" fill="${headInk}" font-family="Manrope,Arial">${esc(nombre.length > 30 ? nombre.slice(0, 29) + '…' : nombre)}</text>

  </svg>`;
}

  return `<div class="card">
    <h2>¿Qué diseño te gusta?</h2>
    <p class="sub">Tres variantes aplicadas a tu producto. Los agentes votaron según su contexto; la decisión es tuya. ${final ? '' : 'Las personas con rol de evaluación pueden dar su voto; el responsable decide.'}</p>

function lineChart(d) {
  const W = 760, H = 220, L = 44, R = 12, T = 12, B = 26;
  const max = Math.ceil(Math.max(...d.map(x => x.visitas)) / 500) * 500;
  const x = i => L + i * (W - L - R) / (d.length - 1), y = v => T + (1 - v / max) * (H - T - B);
  const path = d.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.visitas).toFixed(1)}`).join('');
  const grid = [0, max / 2, max].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${v.toLocaleString('es')}</text>`).join('');
  const lab = [0, 10, 20, 29].map(i => `<text x="${x(i)}" y="${H - 6}" font-size="11" text-anchor="middle" fill="var(--muted)">${d[i].fecha.slice(5).split('-').reverse().join('/')}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas por día en los últimos 30 días">${grid}${lab}
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>
    <line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle id="xd" r="5" fill="var(--brand)" stroke="var(--board)" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
}
function wireChart(p) {
  const box = document.getElementById('chart-visitas'); if (!box) return;
  const d = p.seguimiento.dias; const svg = box.querySelector('svg');
  const W = 760, H = 220, L = 44, R = 12, T = 12, B = 26;
  const max = Math.ceil(Math.max(...d.map(x => x.visitas)) / 500) * 500;
  const hit = svg.querySelector('#hit'), xh = svg.querySelector('#xh'), xd = svg.querySelector('#xd'), tip = box.querySelector('#tip');
  hit.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(d.length - 1, Math.round((sx - L) / (W - L - R) * (d.length - 1))));
    const px = L + i * (W - L - R) / (d.length - 1), py = T + (1 - d[i].visitas / max) * (H - T - B);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    xd.setAttribute('cx', px); xd.setAttribute('cy', py); xd.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (px / W * r.width) + 'px'; tip.style.top = (py / H * r.height) + 'px';
    tip.innerHTML = `<strong>${d[i].visitas.toLocaleString('es')}</strong> visitas · ${new Date(d[i].fecha + 'T12:00').toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' })}`;
  });
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); });
}

const CARPETAS = [
  ['contexto', 'Contexto y problema', /context|problema|brief|antecedente/i],
  ['negocio', 'Negocio', /negocio|business|modelo|plan|estrategia/i],
  ['producto', 'Producto', /producto|product|funcional|requisit|historia|backlog|figma/i],
  ['objetivo', 'Objetivo', /objetiv|meta|kpi|okr/i],
  ['poblacion', 'Población y público', /poblaci|publico|público|usuario|persona|segment/i],
  ['investigacion', 'Investigación y reuniones', /reuni|entrevist|investig|transcrip|acta|encuesta/i],
  ['metricas', 'Métricas actuales', /metric|analytics|datos|kpi|xlsx|csv/i]
];
const TEXTUALES = /\.(zip|pdf|docx?|xlsx?|csv|txt|md|rtf|odt|ods)$/i;
// Máximo por envío: 10 MB entre el zip y los documentos (lo mismo que aceptará la plataforma en Vercel).
const LIMITE_ENVIO = 10 * 1024 * 1024;
const mb = b => (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
// Reparte archivos en aceptados, no textuales y demasiado grandes, sin pasar del límite del envío.
function filtrarEnvio(files, usados) {
  const r = { ok: [], ignorados: [], grandes: [], usados };
  [...files].forEach(x => {
    if (!TEXTUALES.test(x.name)) return r.ignorados.push(x.name);
    if (r.usados + x.size > LIMITE_ENVIO) return r.grandes.push(`${x.name} (${mb(x.size)})`);
    r.usados += x.size; r.ok.push(x);
  });
  return r;
}
