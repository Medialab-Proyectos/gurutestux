  const repartir = files => {
    const r = filtrarEnvio(files, w.bytes || 0);
    r.ok.forEach(x => { w.archivos.push(x.name); (w._files || (w._files = [])).push(x); });
    w.ignorados.push(...r.ignorados); w.bytes = r.usados;
    if (r.grandes.length) toast(`No caben en los 10 MB del envío: ${r.grandes.join(', ')}. Comprime o quita documentos.`);
  };
  const f = document.getElementById('w-files'), drop = document.getElementById('drop');
  if (f) {
    f.onchange = () => { sync(); repartir(f.files); render(); };
    drop.ondragover = ev => { ev.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = ev => { ev.preventDefault(); sync(); repartir(ev.dataTransfer.files); render(); };
  }
  document.querySelectorAll('[data-rol]').forEach(s => s.onchange = () => { w.miembros[+s.dataset.rol].rol = s.value; render(); });
  document.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => { w.miembros.splice(+b.dataset.quitar, 1); render(); });
  const add = document.getElementById('w-add');
  if (add) add.onclick = () => { const id = $('#w-dir').value; if (!id) return $('#w-dir').focus(); w.miembros.push({ persona: id, rol: $('#w-dir-rol').value }); render(); };
  const inv = document.getElementById('w-inv');
  if (inv) inv.onclick = () => {
    const n = $('#w-inv-nombre').value.trim(); if (!n) return $('#w-inv-nombre').focus();
    const id = 'p' + Date.now(); DB.personas.push({ id, nombre: n, org: $('#w-inv-org').value.trim() || 'Invitada', cargo: 'Invitación pendiente' });
    w.miembros.push({ persona: id, rol: $('#w-dir-rol').value }); save(); render(); toast(`Invitación enviada a ${n}.`);
  };
  document.querySelectorAll('[data-paso]').forEach(b => b.onclick = () => { sync(); w.paso = +b.dataset.paso; render(); $('#view').focus(); });
  const cons = document.getElementById('w-consiente'); if (cons) cons.onchange = () => { w.consiente = cons.checked; $('#w-next').disabled = !validoWizard(w); $('#w-motivo').textContent = validoWizard(w) ? '' : motivoWizard(w); };
  document.querySelectorAll('[data-legal]').forEach(a => a.onclick = ev => { ev.preventDefault(); verLegal(a.dataset.legal); });
  $('#w-back').onclick = () => { sync(); if (w.paso === 1) salirDelAsistente('#/proyectos'); else { w.paso--; render(); } };
  $('#w-next').onclick = () => {
    sync();
    if (w.paso < 4) { w.paso++; render(); $('#view').focus(); return; }
    if (!w.consiente) return;
    const cta = cuentaActual();
    const consentimiento = { documento: 'acuerdo', version: LEGAL.acuerdo.version, fecha: new Date().toISOString(), cuenta: cta.id, nombre: cta.nombre, correo: cta.correo };
    w.url = urlNormal(w.url); w.miembros = [{ persona: cta.id, rol: 'responsable' }];
    const id = 'p-' + Date.now().toString(36);
    const mp = w.tipo === 'sintetico' && w.motor ? motorProyecto(w.motor) : null;
    if (mp) {
      const np = proyectoDesdeMotor(mp, { id, cuenta: cta.id, consentimiento, cliente: w.cliente, nombre: w.nombre.trim(), url: w.url.trim(), creado: new Date().toISOString(), miembros: w.miembros, deriva_de: w.deriva || null,
        fuentes: fuentesDe(w) });
      DB.proyectos.unshift(np); sincronizarProyecto(np);
      correoEquipo(np, `Nuevo proyecto para ejecutar: ${np.nombre}`, fichaProyecto(np)); guardarAdjuntosDe(w, id); quitarBorrador(w);
      UI.wizard = null; UI.recienCreado = id; save(); location.hash = '#/p/' + id; return;
    }
    const cat = TIPOS[w.tipo].etapas; const now = new Date().toISOString(); const primera = cat[0];
    const estado0 = w.tipo === 'completo' ? 'analista' : primera.modo === 'humana' ? 'humana' : 'pensando';
    DB.proyectos.unshift({ id, cuenta: cta.id, consentimiento, cliente: w.cliente, nombre: w.nombre.trim(), tipo: w.tipo, url: w.url.trim(), creado: now, deriva_de: w.deriva || null, miembros: w.miembros,
      fuentes: fuentesDe(w),
      etapas: cat.map(e => ({ n: e.n, estado: e === primera ? estado0 : 'cola', inicio: e === primera && estado0 !== 'analista' ? now : null, fin: null })) });
    if (w.tipo === 'completo') avisar(id, 'equipo', `Un proyecto nuevo acaba de iniciar: ${w.nombre.trim()}`);
    correoEquipo(proyecto(id), `Nuevo proyecto para ejecutar: ${w.nombre.trim()}`, fichaProyecto(proyecto(id)));
    guardarAdjuntosDe(w, id); quitarBorrador(w);
    UI.wizard = null; UI.recienCreado = id; save(); location.hash = '#/p/' + id;
  };
}

/* ---- Prototipo de prueba */
function abrirPrototipo(pid, n) {
  const p = proyecto(pid); const e = p.etapas.find(x => x.n === +n);
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg-head"><div><h2 id="dlgTitle" style="font-size:17px;font-weight:800">${esc(e.prototipo)}</h2><p class="sub">${esc(p.nombre)} · ${esc(defEtapa(p, e.n).nombre)}</p></div><button class="btn small" id="dlgClose">Cerrar</button></div>
    <div class="dlg-body"><div style="display:grid;grid-template-columns:180px 1fr;min-height:320px;border:1px solid var(--line);border-radius:8px;overflow:hidden">
      <nav style="padding:14px;background:var(--brand);color:#fff;display:grid;gap:8px;align-content:start"><strong>${esc(p.nombre)}</strong>${['Inicio', 'Tarea principal', 'Confirmación', 'Estado de error'].map((t, i) => `<button class="btn small" style="justify-content:flex-start;${i ? 'background:transparent;color:#fff;border-color:#ffffff66' : ''}">${t}</button>`).join('')}</nav>
      <div style="padding:22px"><h3 style="color:var(--blue);font-size:18px">Inicio</h3><p class="sub">Aquí se carga el prototipo HTML real que generó la etapa. Pruébalo y deja una nota si algo no te convence.</p>
      <div class="grid2" style="margin-top:14px"><div class="note-box">Contenido y rutas construidos con tus fuentes.</div><div class="note-box green">Incluye los ajustes que aceptaste en la etapa anterior.</div></div></div></div></div>`;
  dlg.showModal(); $('#dlgClose').onclick = () => dlg.close();
}

/* --------------------------------------------------------------- Router */
function render() {
  tick();
  aplicarColapso();
  const ruta = (location.hash.replace(/^#\/?/, '') || 'proyectos').split('/');
  const c = cuentaActual(); if (!c) UI.sesion = null;
  const app = document.querySelector('.app');
  if (!c || !aceptoVigente(c)) {
    app.classList.add('sin-sesion');
    const vista = !c ? (ruta[0] === 'legal' ? legalHTML(ruta[1]) : vistaIngreso(ruta[0] === 'crear-cuenta' ? 'crear' : 'ingresar')) : ruta[0] === 'legal' ? legalHTML(ruta[1]) : vistaAceptar();
    $('#view').innerHTML = vista;
    if (!c && ruta[0] !== 'legal') wireIngreso(ruta[0] === 'crear-cuenta' ? 'crear' : 'ingresar');
    if (c && ruta[0] !== 'legal') {
      $('#ac-salir').onclick = cerrarSesion;
      $('#ac-si').onclick = () => { if (!$('#ac-acepto').checked) return toast('Marca la casilla para continuar.'); c.aceptaciones = [...(c.aceptaciones || []), ...aceptaciones()]; save(); render(); };
    }
    document.querySelectorAll('[data-legal]').forEach(a => a.onclick = ev => { ev.preventDefault(); verLegal(a.dataset.legal); });
    return;
  }
  app.classList.remove('sin-sesion');
  renderSide(ruta);
  let html = '', crumbs = [['Proyectos', '#/proyectos']];
  if (ruta[0] === 'p' && ruta[1]) {
    const p = proyecto(ruta[1]);
    if (ruta[2] === 'e') UI.etapaVista[ruta[1]] = +ruta[3];
    html = vistaProyecto(ruta[1], ruta[2] === 'e' ? ruta[3] : null);
    if (p) crumbs.push([p.nombre, '#/p/' + p.id]);
  } else if (ruta[0] === 'nuevo') {
    if (ruta[1]) { const b = (DB.borradores || []).find(x => x.id === ruta[1]); if (b && (!UI.wizard || UI.wizard.borrador !== b.id)) UI.wizard = Object.assign(nuevoWizard(), JSON.parse(JSON.stringify(b.w))); }
    html = vistaNuevo(); crumbs.push(['Nuevo proyecto', '#/nuevo']);
  }
  else if (ruta[0] === 'validar') { html = vistaValidar(); crumbs = [['Pendientes', '#/validar']]; }
  else if (ruta[0] === 'legal') { html = legalHTML(ruta[1]); crumbs = [[(LEGAL[ruta[1]] || {}).titulo || 'Documento', '#/legal/' + ruta[1]]]; }

  else html = vistaProyectos();
  renderTop(crumbs);
  $('#view').innerHTML = html;
  wire(ruta);
}
function wire(ruta) {
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { location.hash = `#/p/${ruta[1]}/e/${b.dataset.step}`; });
  document.querySelectorAll('[data-decidir]').forEach(b => b.onclick = () => { const [id, st] = b.dataset.decidir.split(':'); decidir(id, st); });
  document.querySelectorAll('[data-deshacer]').forEach(b => b.onclick = () => deshacer(b.dataset.deshacer));
  document.querySelectorAll('[data-nota]').forEach(b => b.onclick = () => { const [pid, n] = b.dataset.nota.split(':'); agregarNota(pid, +n); });
  document.querySelectorAll('[data-continuar]').forEach(b => b.onclick = () => continuar(b.dataset.continuar));
  document.querySelectorAll('[data-adelantar]').forEach(b => b.onclick = () => adelantar(b.dataset.adelantar));
  document.querySelectorAll('[data-probar]').forEach(b => b.onclick = () => { const [pid, n] = b.dataset.probar.split(':'); abrirPrototipo(pid, n); });
  document.querySelectorAll('[data-elegir]').forEach(b => b.onclick = () => {
    const [vid, fin] = b.dataset.elegir.split(':'); const v = DB.variantes.find(x => x.id === vid); elegir(v.proyecto, v.etapa, vid, fin === '1');
  });
  document.querySelectorAll('[data-enc]').forEach(b => b.onclick = () => {
    const [pid, i] = b.dataset.enc.split(':'); const q = proyecto(pid).seguimiento.encuestas[+i]; q.activa = !q.activa; save(); render();
    toast(`${q.tipo} ${q.activa ? 'activada: empezará a aparecer en el producto.' : 'desactivada.'}`);
  });
  document.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => { UI.abiertos[b.dataset.abrir] = !UI.abiertos[b.dataset.abrir]; render(); });
  document.querySelectorAll('[data-estudio]').forEach(b => b.onclick = () => {
    const i = b.dataset.estudio.indexOf(':'); const p = proyecto(b.dataset.estudio.slice(0, i));
    p.motor.estudio = b.dataset.estudio.slice(i + 1); sincronizarProyecto(p); save(); render();
    toast('El proyecto usa ahora ese estudio. Las decisiones sobre hallazgos que se repiten se conservan.');
  });
  document.querySelectorAll('[data-addmiembro]').forEach(b => b.onclick = () => {
    const p = proyecto(b.dataset.addmiembro); const id = $('#add-per').value; if (!id) return $('#add-per').focus();
    p.miembros.push({ persona: id, rol: $('#add-rol').value }); if (p.motor) sincronizarProyecto(p); save(); render();
    toast(`${persona(id).nombre} se sumó al proyecto.`);
  });
  document.querySelectorAll('[data-opinion]').forEach(b => b.onclick = () => { const [pid, n] = b.dataset.opinion.split(':'); guardarOpinion(pid, +n); });
  document.querySelectorAll('[data-vuelta]').forEach(b => b.onclick = () => { const [pid, n] = b.dataset.vuelta.split(':'); otraVuelta(pid, +n); });
  document.querySelectorAll('[data-sindudas]').forEach(c => c.onchange = () => { const [pid, n] = c.dataset.sindudas.split(':'); marcarSinDudas(pid, +n, c.checked); });
  document.querySelectorAll('[data-lanzar]').forEach(b => b.onclick = () => lanzarAnalista(b.dataset.lanzar));
  document.querySelectorAll('[data-auditar]').forEach(b => b.onclick = () => guardarAuditoria(b.dataset.auditar));
  document.querySelectorAll('[data-editar]').forEach(b => b.onclick = () => { UI.editando[b.dataset.editar] = true; render(); });
  document.querySelectorAll('[data-noeditar]').forEach(b => b.onclick = () => { delete UI.editando[b.dataset.noeditar]; render(); });
  document.querySelectorAll('[data-reejecutar]').forEach(b => b.onclick = () => pedirReejecucion(b.dataset.reejecutar));
  document.querySelectorAll('[data-reporte]').forEach(b => b.onclick = () => reportePDF(b.dataset.reporte));
  document.querySelectorAll('[data-detener]').forEach(b => b.onclick = () => detener(b.dataset.detener));
  document.querySelectorAll('[data-reanudar]').forEach(b => b.onclick = () => reanudar(b.dataset.reanudar));
  document.querySelectorAll('[data-cancelar]').forEach(b => b.onclick = () => cancelarProyecto(b.dataset.cancelar));
  document.querySelectorAll('[data-reabrir]').forEach(b => b.onclick = () => reabrir(b.dataset.reabrir));
  document.querySelectorAll('[data-rehacer]').forEach(b => b.onclick = () => rehacer(b.dataset.rehacer));
  document.querySelectorAll('[data-recorrido]').forEach(b => b.onclick = () => verRecorrido(b.dataset.recorrido));
  document.querySelectorAll('[data-mapa-tipo]').forEach(b => b.onclick = () => { const [pid, t] = b.dataset.mapaTipo.split(':'); UI.mapas[pid].tipo = t; render(); });
  document.querySelectorAll('[data-mapa-disp]').forEach(b => b.onclick = () => { const [pid, d] = b.dataset.mapaDisp.split(':'); UI.mapas[pid].disp = d; render(); });
  document.querySelectorAll('[data-mapa-ver]').forEach(b => b.onclick = () => { const [pid, i] = b.dataset.mapaVer.split(':'); verMapa(pid, +i); });
  const exp = document.getElementById('exportar'); if (exp) exp.onclick = exportarTodo;
  const imp = document.getElementById('importar'); if (imp) imp.onchange = () => imp.files[0] && importarTodo(imp.files[0]);
  document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => { Adjuntos.borrar(b.dataset.borrar); DB.borradores = DB.borradores.filter(x => x.id !== b.dataset.borrar); save(); render(); toast('Borrador eliminado.'); });
  document.querySelectorAll('[data-fg]').forEach(b => b.onclick = () => { const [k, g] = b.dataset.fg.split('|'); UI.filtros[k].g = g; UI.abiertos[k] = false; render(); });
  document.querySelectorAll('[data-fest]').forEach(x => x.onchange = () => { UI.filtros[x.dataset.fest].est = x.value; render(); });
  document.querySelectorAll('[data-fval]').forEach(x => x.onchange = () => { UI.filtros[x.dataset.fval].val = x.value; render(); });
  wireCanvas();
  pintarAdjuntos();
  if (ruta[0] === 'nuevo') wireWizard();
  if (ruta[0] === 'p') { const p = proyecto(ruta[1]); if (p && p.seguimiento) wireChart(p); }
  $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
}
$('#menuBtn').onclick = () => { const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/p/' + UI.recienCreado)) UI.recienCreado = null; render(); window.scrollTo(0, 0); });

/* Las barras de «pensando» avanzan solas; sin redibujar para no perder lo que se escribe. */
setInterval(() => {
  if (tick()) return render();
  document.querySelectorAll('[data-etapa]').forEach(el => {
    const [pid, n] = el.dataset.etapa.split(':'); const p = proyecto(pid); const pr = progresoEtapa(p, p.etapas.find(e => e.n === +n));
    if (pr) el.style.width = pr.pct + '%';
  });
  document.querySelectorAll('[data-proy]').forEach(el => { el.style.width = progresoProyecto(proyecto(el.dataset.proy)).pct + '%'; });
}, 20000);

(async () => {
  try { const r = await fetch('api/estado', { cache: 'no-store' }); SERVIDOR = r.ok && (await r.json()).ok === true; } catch (e) { SERVIDOR = false; }
  if (SERVIDOR) {
    try { const r = await fetch('api/base'); const b = r.ok ? await r.json() : null; if (b && b.version === DB.version) DB = b; } catch (e) {}
  }
  sincronizarMotor();
  render();
})();
</script>
</body>
</html>
